name: Check source pages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-sources.txt
      - run: python -m unittest discover -s tests -p test_sources.py
      - run: python scripts/refresh-sources.py
      - name: Retain review status without republishing raw page copies
        uses: actions/upload-artifact@v4
        with:
          name: source-review-report
          path: |
            public/knowledge/source-status.json
            public/knowledge/source-refresh-report.md
